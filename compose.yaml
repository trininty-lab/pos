name: point-of-sales

services:
  app:
    build:
      context: .
      target: runtime
    image: ${APP_IMAGE:-point-of-sales:local}
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-point_of_sales}
      DB_USERNAME: ${DB_USERNAME:-pos}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the shell or .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      WA_SERVICE_URL: http://whatsapp:3001
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: ${WEB_IMAGE:-point-of-sales-web:local}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/www/html/storage/app:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  queue:
    image: ${APP_IMAGE:-point-of-sales:local}
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      REDIS_HOST: redis
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-point_of_sales}
      DB_USERNAME: ${DB_USERNAME:-pos}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the shell or .env}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    image: ${APP_IMAGE:-point-of-sales:local}
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      REDIS_HOST: redis
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-point_of_sales}
      DB_USERNAME: ${DB_USERNAME:-pos}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the shell or .env}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-point_of_sales}
      MYSQL_USER: ${DB_USERNAME:-pos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  whatsapp:
    profiles: ["whatsapp"]
    build:
      context: ./whatsapp-service
    environment:
      PORT: 3001
    volumes:
      - whatsapp-session:/app/session
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  app-storage:
  app-framework:
  app-logs:
  app-bootstrap-cache:
  db-data:
  redis-data:
  whatsapp-session:

networks:
  frontend:
  backend:
    internal: true
